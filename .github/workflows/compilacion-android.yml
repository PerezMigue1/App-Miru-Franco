name: Compilación Android

on:
  push:
    branches: [main, release]
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:
    inputs:
      perfil:
        description: Perfil de eas.json que se compila
        type: choice
        required: true
        default: production
        options:
          - production
          - preview

permissions:
  contents: read

# Una compilación a la vez por rama; la que está corriendo no se cancela.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compilar:
    name: Compilar con EAS
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      url_artefacto: ${{ steps.datos.outputs.url_artefacto }}
      id_build: ${{ steps.datos.outputs.id_build }}
      perfil: ${{ steps.datos.outputs.perfil }}
    steps:
      # En push siempre es production; en manual, el elegido. Solo se aceptan esos dos valores.
      - name: Elegir el perfil
        id: perfil
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          PERFIL_MANUAL: ${{ inputs.perfil }}
        run: |
          set -euo pipefail
          perfil="production"
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            perfil="$PERFIL_MANUAL"
          fi
          case "$perfil" in
            production | preview) ;;
            *)
              echo "::error::Perfil no permitido. Solo production o preview."
              exit 1
              ;;
          esac
          echo "perfil=$perfil" >> "$GITHUB_OUTPUT"

      - name: Descargar el código
        uses: actions/checkout@v7

      # EXPO_PUBLIC_API_URL y EXPO_PUBLIC_WEB_URL se insertan en src al compilar y la ofuscación
      # las codifica, así que el análisis del bundle ya no las ve; por eso se revisan aquí, antes.
      - name: Verificar el perfil de compilación
        shell: bash
        env:
          PERFIL: ${{ steps.perfil.outputs.perfil }}
        run: |
          node -e '
            const fs = require("fs");
            const perfil = process.env.PERFIL;
            const env = JSON.parse(fs.readFileSync("eas.json", "utf8")).build?.[perfil]?.env ?? {};
            const esperado = {
              EXPO_PUBLIC_API_URL: "https://api.mirufranco.com",
              EXPO_PUBLIC_WEB_URL: "https://www.mirufranco.com",
              OFUSCAR_JS: "1",
            };
            const fallas = Object.keys(esperado).filter((clave) => env[clave] !== esperado[clave]);
            for (const clave of fallas) {
              console.log("::error::En el perfil " + perfil + " de eas.json, " + clave + " no tiene el valor esperado.");
            }
            process.exit(fallas.length > 0 ? 1 : 0);
          '

      - name: Preparar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Preparar EAS CLI
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: 25.3.0
          token: ${{ secrets.EXPO_TOKEN }}

      # Con --json, eas-cli manda los avisos a stderr y deja en stdout solo el arreglo de builds.
      - name: Compilar en EAS
        id: eas
        shell: bash
        env:
          PERFIL: ${{ steps.perfil.outputs.perfil }}
        run: |
          set -euo pipefail
          eas build --platform android --profile "$PERFIL" --non-interactive --wait --json \
            > "$RUNNER_TEMP/eas-build.json"

      # Corre también si la compilación falló, para dejar el enlace al build en el resumen.
      - name: Leer el resultado de EAS
        id: datos
        if: ${{ !cancelled() && steps.eas.outcome != 'skipped' }}
        shell: bash
        env:
          PERFIL: ${{ steps.perfil.outputs.perfil }}
        run: |
          set -euo pipefail
          archivo="$RUNNER_TEMP/eas-build.json"
          if ! jq -e 'type == "array" and length == 1' "$archivo" > /dev/null 2>&1; then
            echo "::error::EAS no devolvió exactamente una compilación."
            exit 1
          fi
          id_build="$(jq -r '.[0].id // empty' "$archivo")"
          estado="$(jq -r '.[0].status // empty' "$archivo")"
          perfil_build="$(jq -r '.[0].buildProfile // empty' "$archivo")"
          url="$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // empty' "$archivo")"
          if ! [[ "$id_build" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::El id del build no tiene el formato esperado."
            exit 1
          fi
          {
            echo "## Compilación Android (EAS)"
            echo ""
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Perfil | $PERFIL |"
            echo "| Id del build | $id_build |"
            echo "| Estado | ${estado:-sin dato} |"
            echo ""
            echo "Build en Expo: https://expo.dev/accounts/miru_franco/projects/App-Miru-Franco/builds/$id_build"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$estado" != "FINISHED" ]; then
            echo "::error::La compilación no terminó bien (estado: ${estado:-sin dato})."
            exit 1
          fi
          if [ "$perfil_build" != "$PERFIL" ]; then
            echo "::error::EAS compiló un perfil distinto al pedido."
            exit 1
          fi
          if [[ "$url" != https://* ]]; then
            echo "::error::EAS no devolvió la URL del artefacto."
            exit 1
          fi
          {
            echo "url_artefacto=$url"
            echo "id_build=$id_build"
            echo "perfil=$perfil_build"
          } >> "$GITHUB_OUTPUT"

  analizar:
    name: Análisis del binario (JADX y MobSF)
    needs: compilar
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # El APK, el AAB y el keystore desechable quedan en RUNNER_TEMP, fuera de DIR_REPORTES.
      - name: Analizar el binario
        shell: bash
        env:
          URL_ARTEFACTO: ${{ needs.compilar.outputs.url_artefacto }}
          PERFIL: ${{ needs.compilar.outputs.perfil }}
          VERSION_BUNDLETOOL: 1.18.3
          SHA256_BUNDLETOOL: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
          VERSION_JADX: 1.5.6
          SHA256_JADX: 545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974
          IMAGEN_MOBSF: opensecurity/mobile-security-framework-mobsf:v4.5.3
          DIR_REPORTES: ${{ runner.temp }}/reportes
        run: bash .github/scripts/analizar-binario.sh

      # Solo reportes: MobSF (JSON y PDF), resumen de JADX y salida de aapt2.
      - name: Subir reportes del análisis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analisis-binario-android
          path: |
            ${{ runner.temp }}/reportes/mobsf-reporte.json
            ${{ runner.temp }}/reportes/mobsf-reporte.pdf
            ${{ runner.temp }}/reportes/jadx-resumen.md
            ${{ runner.temp }}/reportes/aapt2-badging.txt
          if-no-files-found: warn
          retention-days: 14
